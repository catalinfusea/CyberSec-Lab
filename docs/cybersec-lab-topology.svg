<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Inter, DejaVu Sans, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#ffffff"/>

  <!-- Internet -->
  <rect x="690" y="18" width="220" height="50" rx="25" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="800" y="50" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2937">Internet</text>
  <line x1="800" y1="68" x2="800" y2="150" stroke="#64748b" stroke-width="3"/>

  <!-- Host container -->
  <rect x="20" y="100" width="1560" height="880" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
  <text x="44" y="132" font-size="19" font-weight="700" fill="#1f2937">Windows host · VMware Workstation 26H1 · Vagrant 2.4.9 + vagrant-vmware-desktop 3.0.5</text>

  <!-- VMnet8 NAT -->
  <rect x="60" y="150" width="1480" height="46" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="800" y="179" text-anchor="middle" font-size="17" fill="#1f2937">VMware NAT (VMnet8)  ·  pfSense WAN  +  a Vagrant-only management NIC on every VM (SSH / WinRM)</text>

  <!-- pfSense -->
  <line x1="800" y1="196" x2="800" y2="250" stroke="#64748b" stroke-width="3"/>
  <text x="812" y="228" font-size="15" fill="#475569">WAN</text>
  <rect x="610" y="250" width="380" height="120" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="800" y="284" text-anchor="middle" font-size="22" font-weight="700" fill="#7f1d1d">pfSense CE 2.9.0</text>
  <text x="800" y="312" text-anchor="middle" font-size="16" fill="#1f2937">gateway · DNS resolver · NTP · Suricata (LAN)</text>
  <text x="800" y="336" text-anchor="middle" font-size="16" fill="#1f2937">blocks lab → home network, lab → pfSense UI</text>
  <text x="800" y="358" text-anchor="middle" font-size="15" fill="#475569">192.168.0.254</text>
  <line x1="800" y1="370" x2="800" y2="430" stroke="#334155" stroke-width="3"/>
  <text x="812" y="406" font-size="15" fill="#475569">LAN</text>

  <!-- VMnet3 -->
  <rect x="60" y="430" width="1480" height="46" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="800" y="459" text-anchor="middle" font-size="17" fill="#1f2937">Isolated lab network (VMnet3, host-only)  ·  192.168.0.0/24  ·  no host adapter, all traffic out via pfSense</text>

  <!-- VM cards: x = 60 + i*215, w=190 -->
  <g font-size="15" fill="#1f2937" text-anchor="middle">
    <!-- dc01 -->
    <line x1="155" y1="476" x2="155" y2="540" stroke="#334155" stroke-width="2.5"/>
    <rect x="60" y="540" width="190" height="160" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
    <text x="155" y="568" font-size="19" font-weight="700">dc01</text>
    <text x="155" y="592">Windows Server 2022</text>
    <text x="155" y="614">AD DC · lab.internal</text>
    <text x="155" y="636">BadBlood (~1,000 users)</text>
    <text x="155" y="658">Sysmon · time source</text>
    <text x="155" y="684" fill="#475569">.10</text>

    <!-- ws01 -->
    <line x1="370" y1="476" x2="370" y2="540" stroke="#334155" stroke-width="2.5"/>
    <rect x="275" y="540" width="190" height="160" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
    <text x="370" y="568" font-size="19" font-weight="700">ws01</text>
    <text x="370" y="592">Windows 11 25H2</text>
    <text x="370" y="614">domain-joined</text>
    <text x="370" y="636">Sysmon · Defender on</text>
    <text x="370" y="658">PowerShell logging</text>
    <text x="370" y="684" fill="#475569">.31</text>

    <!-- ws02 -->
    <line x1="585" y1="476" x2="585" y2="540" stroke="#334155" stroke-width="2.5"/>
    <rect x="490" y="540" width="190" height="160" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
    <text x="585" y="568" font-size="19" font-weight="700">ws02</text>
    <text x="585" y="592">Windows 11 25H2</text>
    <text x="585" y="614">domain-joined</text>
    <text x="585" y="636">Sysmon · Defender on</text>
    <text x="585" y="658">PowerShell logging</text>
    <text x="585" y="684" fill="#475569">.32</text>

    <!-- lin01 -->
    <line x1="800" y1="476" x2="800" y2="540" stroke="#334155" stroke-width="2.5"/>
    <rect x="705" y="540" width="190" height="160" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="800" y="568" font-size="19" font-weight="700">lin01</text>
    <text x="800" y="592">Ubuntu 24.04</text>
    <text x="800" y="614">auditd</text>
    <text x="800" y="636">(Neo23x0 rules)</text>
    <text x="800" y="684" fill="#475569">.41</text>

    <!-- wazuh01 -->
    <line x1="1015" y1="476" x2="1015" y2="540" stroke="#334155" stroke-width="2.5"/>
    <rect x="920" y="540" width="190" height="160" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
    <text x="1015" y="568" font-size="19" font-weight="700">wazuh01</text>
    <text x="1015" y="592">Ubuntu 24.04</text>
    <text x="1015" y="614">Wazuh 4.14 all-in-one</text>
    <text x="1015" y="636">manager · indexer</text>
    <text x="1015" y="658">dashboard</text>
    <text x="1015" y="684" fill="#475569">.20</text>

    <!-- admin01 -->
    <line x1="1230" y1="476" x2="1230" y2="540" stroke="#334155" stroke-width="2.5"/>
    <rect x="1135" y="540" width="190" height="160" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="1230" y="568" font-size="19" font-weight="700">admin01</text>
    <text x="1230" y="592">Kali Linux</text>
    <text x="1230" y="614">admin jump box</text>
    <text x="1230" y="636">+ attacker</text>
    <text x="1230" y="658">only path to the UIs</text>
    <text x="1230" y="684" fill="#475569">.50</text>

    <!-- elastic01 planned -->
    <line x1="1445" y1="476" x2="1445" y2="540" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
    <rect x="1350" y="540" width="190" height="160" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="1445" y="568" font-size="19" font-weight="700" fill="#64748b">elastic01</text>
    <text x="1445" y="592" fill="#64748b">Elastic Security</text>
    <text x="1445" y="614" fill="#64748b">phase 2 (planned)</text>
    <text x="1445" y="684" fill="#94a3b8">.21</text>
  </g>

  <!-- Wazuh agent flows -->
  <g stroke="#1d4ed8" stroke-width="2.5" fill="none">
    <line x1="155" y1="700" x2="155" y2="745"/>
    <line x1="370" y1="700" x2="370" y2="745"/>
    <line x1="585" y1="700" x2="585" y2="745"/>
    <line x1="800" y1="700" x2="800" y2="745"/>
    <line x1="155" y1="745" x2="1015" y2="745"/>
    <line x1="1015" y1="745" x2="1015" y2="704" marker-end="url(#arr)"/>
  </g>
  <text x="480" y="772" text-anchor="middle" font-size="16" fill="#1d4ed8" font-weight="600">Wazuh agents → manager (TCP 1514/1515): Windows Security + Sysmon + PowerShell, auditd</text>

  <!-- Host user + tunnel -->
  <rect x="60" y="830" width="520" height="120" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="80" y="864" font-size="19" font-weight="700" fill="#1f2937">Me, on the host</text>
  <text x="80" y="890" font-size="15" fill="#1f2937">no adapter on the lab network</text>
  <text x="80" y="912" font-size="15" fill="#1f2937">pfSense / Wazuh UIs only through an SSH tunnel:</text>
  <text x="80" y="934" font-size="14" fill="#475569" font-family="DejaVu Sans Mono, monospace">vagrant ssh admin01 -- -L 8444:192.168.0.20:443 -N</text>

  <path d="M580,890 L1230,890 L1230,704" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#arrg)"/>
  <text x="905" y="880" text-anchor="middle" font-size="15" fill="#7c3aed" font-weight="600">SSH tunnel via the Vagrant NAT port-forward</text>

  <!-- Legend -->
  <g font-size="14" fill="#1f2937">
    <rect x="1290" y="820" width="260" height="140" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="1306" y="845" font-weight="700">Legend</text>
    <line x1="1306" y1="868" x2="1356" y2="868" stroke="#334155" stroke-width="3"/>
    <text x="1366" y="873">lab network</text>
    <line x1="1306" y1="895" x2="1356" y2="895" stroke="#1d4ed8" stroke-width="3"/>
    <text x="1366" y="900">telemetry</text>
    <line x1="1306" y1="922" x2="1356" y2="922" stroke="#7c3aed" stroke-width="3" stroke-dasharray="9 6"/>
    <text x="1366" y="927">admin tunnel</text>
    <rect x="1306" y="938" width="50" height="14" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
    <text x="1366" y="950">planned</text>
  </g>
</svg>
